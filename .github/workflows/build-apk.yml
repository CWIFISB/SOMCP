name: Build APK Artifacts

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;29.0.14206865 cmake;3.22.1'

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build dos2unix

      - name: Build Rizin native backend
        run: |
          dos2unix build-rizin.sh
          bash build-rizin.sh arm64-v8a third_party/rizin-src
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865

      - name: Build LIEF native backend
        run: |
          dos2unix build-lief.sh
          bash build-lief.sh arm64-v8a
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug -PrequireNativeBackends=true
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: somcp-arm64-debug-apk
          path: app/build/outputs/apk/debug/**/*.apk
          retention-days: 30
          if-no-files-found: warn
