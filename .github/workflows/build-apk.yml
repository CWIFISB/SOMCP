name: Build APK Artifacts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Build Debug APK (arm64-v8a)
        run: gradle :app:assembleDebug -Pandroid.targetAbi=arm64-v8a --stacktrace

      - name: Upload arm64 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: somcp-arm64-debug-apk
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload universal Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: somcp-universal-debug-apk
          path: app/build/outputs/apk/debug/app-universal-debug.apk
          retention-days: 30
          if-no-files-found: warn
